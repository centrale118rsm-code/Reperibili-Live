<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f5f7">
<title>Codici operatori 118</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
<style>
:root{
  --bg:#f4f5f7; --card:#fff; --line:#e6e8ec; --line2:#eef0f3; --tx:#0e1525; --tx2:#5b6475; --tx3:#9aa2b1;
  --aut:#d97706; --inf:#2563eb; --ok:#16a34a; --red:#e3192b; --field:#f7f8fa;
  --shadow:0 1px 2px rgba(16,24,40,.04), 0 8px 24px rgba(16,24,40,.06);
  --f:'Inter Tight', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#06080d; --card:#0e121b; --line:#1d2330; --line2:#171c27; --tx:#e3e7ef; --tx2:#8a93a6; --tx3:#566074;
    --aut:#e0a040; --inf:#5b8de0; --ok:#30a860; --red:#e5484d; --field:#141925; --shadow:0 0 0 1px rgba(255,255,255,.03); color-scheme:dark }
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font-family:var(--f);-webkit-font-smoothing:antialiased;min-height:100vh;padding:28px 16px 110px}
.wrap{max-width:900px;margin:0 auto}
h1{font-size:26px;font-weight:700;letter-spacing:-.02em}
.sub{color:var(--tx2);font-size:14px;margin-top:6px;line-height:1.45}
.sub b{color:var(--tx);font-weight:600}
.st{display:inline-flex;align-items:center;gap:8px;margin-top:14px;font-size:13px;font-weight:600;color:var(--tx2);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 12px}
.st::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--tx3)}
.st.ok::before{background:var(--ok)} .st.err{color:var(--red)} .st.err::before{background:var(--red)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:22px;align-items:start}
.col{background:var(--card);border-radius:16px;box-shadow:var(--shadow);border:1px solid var(--line);padding:14px 14px 12px}
.col.aut{--c:var(--aut)} .col.inf{--c:var(--inf)}
.ch{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;padding:0 2px}
.ch b{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--c)}
.ch b::before{content:"";width:10px;height:10px;border-radius:3px;background:var(--c)}
.ch span{font-size:12px;color:var(--tx3);font-weight:600}
.row{display:grid;grid-template-columns:74px 1fr 34px;gap:6px;margin-bottom:6px}
.row input{font:inherit;font-size:15px;color:var(--tx);background:var(--field);border:1px solid var(--line);border-radius:9px;padding:9px 10px;min-width:0;width:100%}
.row input:focus{outline:2px solid var(--c);outline-offset:-1px;background:var(--card)}
.row input.code{text-align:center;font-weight:800;color:var(--c)}
.row input.bad{border-color:var(--red);outline-color:var(--red)}
.row.changed input{background:color-mix(in srgb,var(--c) 9%,var(--field))}
.del{border:0;background:transparent;color:var(--tx3);font-size:15px;border-radius:9px;cursor:pointer}
.del:hover{color:var(--red);background:var(--field)}
.add{width:100%;margin-top:4px;font:inherit;font-size:14px;font-weight:600;color:var(--tx2);background:transparent;border:1.5px dashed var(--line);border-radius:10px;padding:9px;cursor:pointer}
.add:hover{color:var(--c);border-color:var(--c)}
.warn{margin-top:14px;font-size:13px;font-weight:600;color:var(--red);min-height:1em}
.bar{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
.bar .in{max-width:900px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.bar .msg{font-size:14px;color:var(--tx2);font-weight:500}
.bar .msg b{color:var(--tx)}
.btns{display:flex;gap:8px;flex:0 0 auto}
button.b{font:inherit;font-size:15px;font-weight:700;border-radius:11px;padding:11px 18px;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--tx2)}
button.b.pri{background:var(--tx);color:var(--bg);border-color:var(--tx)}
button.b:disabled{opacity:.45;cursor:default}
@media (max-width:680px){ .cols{grid-template-columns:1fr} h1{font-size:22px} .bar .in{flex-direction:column;align-items:stretch} .btns{justify-content:flex-end} }
</style>
</head>
<body>
<div class="wrap">
  <h1>Codici operatori</h1>
  <p class="sub">Le modifiche salvate qui compaiono da sole sullo <b>sfondo dei reperibili</b> (entro un minuto) e sul monitor.<br>Scrivi il nome partendo dal <b>cognome</b>, come nei turni (es. «Barbieri Matteo»).</p>
  <div class="st" id="st">Caricamento…</div>
  <div class="cols" id="cols"></div>
  <div class="warn" id="warn"></div>
</div>
<div class="bar"><div class="in">
  <div class="msg" id="msg">Nessuna modifica</div>
  <div class="btns"><button class="b" id="undo" onclick="annulla()" disabled>Annulla modifiche</button><button class="b pri" id="save" onclick="salva()" disabled>Salva</button></div>
</div></div>

<script>
// ═══ Codici operatori — stessa tabella usata da Reperibili Live (admin_config/monitor_rubrica) ═══
const FB = {
  apiKey: "AIzaSyAMX2ycf_6P3AcBvarVX4XNKbdposkuqgE",
  authDomain: "area-personale-autsocc-118-rsm.firebaseapp.com",
  projectId: "area-personale-autsocc-118-rsm",
  storageBucket: "area-personale-autsocc-118-rsm.firebasestorage.app",
  messagingSenderId: "910283994567",
  appId: "1:910283994567:web:d9c45b5f4b5a83b92595e2"
};
const RUBRICA_DEFAULT = {
  autisti: [['Barbieri Matteo','3a'],['Berardi Pierluigi','8a'],['Bianchi Stefano','5a'],['Fabbri Nicola','1a'],['Ghiotti Gabriele','6a'],
    ['Michelotti Yan','4a'],['Pazzaglia Stefano','10a'],['Sarti Michele','2a'],['Volpini Filippo','7a']].map(([nome, codice]) => ({ nome, codice })),
  infermieri: [['Angelini Stefano','21i'],['Bedetti Matteo','2i'],['Canti Anna Helena','14i'],['Capicchioni Laura','23i'],['Castellani Giorgia','13i'],
    ['Casadei Marco','20i'],['Chiaruzzi Eleonora','5i'],['Gatti Gian Marco','17i'],['Giancecchi Dario','16i'],['Gozi Francesco','12i'],['Lepri Andrea','25i'],
    ['Macherozzi Lucia','10i'],['Mini Stefania','11i'],['Morganti Flavio','4i'],['Mosca Maria Pia','18i'],['Mosconi Matteo','22i'],['Pacelli Ludovica','9i'],
    ['Palumbo Stefano','24i'],['Podeschi Federico','15i'],['Sharov Savva','7i'],['Tiburzi Sara','8i'],['Ticchi Federica','3i'],['Tini Clelia','19i']].map(([nome, codice]) => ({ nome, codice }))
};
let saved = null;      // ultima versione salvata (da Firebase)
let edit = null;       // versione in modifica
let db = null, ref = null, saving = false;

function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function clean(list){ return (Array.isArray(list) ? list : []).map(x => ({ nome: String((x && x.nome) || '').trim(), codice: String((x && x.codice) || '').trim() })); }
function sortList(list){ return list.slice().sort((a, b) => a.nome.localeCompare(b.nome, 'it')); }
function norm(d){ return { autisti: sortList(clean(d.autisti).filter(x => x.nome)), infermieri: sortList(clean(d.infermieri).filter(x => x.nome)) }; }
function same(a, b){ return JSON.stringify(norm(a)) === JSON.stringify(norm(b)); }
function setStatus(t, cls){ const el = document.getElementById('st'); el.textContent = t; el.className = 'st' + (cls ? ' ' + cls : ''); }

function render(){
  const col = (key, title, cls) => {
    const base = new Map((saved ? saved[key] : []).map(x => [x.nome + '|' + x.codice, 1]));
    const list = edit[key];
    return `<div class="col ${cls}"><div class="ch"><b>${title}</b><span>${list.filter(x => x.nome.trim()).length}</span></div>
      ${list.map((e, i) => `<div class="row${base.has(e.nome.trim() + '|' + e.codice.trim()) ? '' : ' changed'}">
        <input class="code" value="${esc(e.codice)}" placeholder="cod." oninput="setv('${key}',${i},'codice',this.value)" aria-label="Codice">
        <input value="${esc(e.nome)}" placeholder="Cognome Nome" oninput="setv('${key}',${i},'nome',this.value)" aria-label="Nome">
        <button class="del" onclick="del('${key}',${i})" aria-label="Elimina" title="Elimina">✕</button></div>`).join('')}
      <button class="add" onclick="add('${key}')">+ Aggiungi</button></div>`;
  };
  document.getElementById('cols').innerHTML = col('autisti', 'Autisti', 'aut') + col('infermieri', 'Infermieri', 'inf');
  check();
}
function check(){
  const dirty = saved && !same(edit, saved);
  document.getElementById('save').disabled = !dirty || saving;
  document.getElementById('undo').disabled = !dirty || saving;
  document.getElementById('msg').innerHTML = saving ? 'Salvataggio…' : dirty ? '<b>Modifiche da salvare</b>' : 'Nessuna modifica';
  // codici ripetuti nello stesso gruppo
  const dup = [];
  ['autisti', 'infermieri'].forEach(k => {
    const seen = {};
    edit[k].forEach(e => { const c = e.codice.trim().toLowerCase(); if(!c || !e.nome.trim()) return; (seen[c] = seen[c] || []).push(e.nome.trim()); });
    Object.keys(seen).forEach(c => { if(seen[c].length > 1) dup.push(`codice «${c}» usato da ${seen[c].join(' e ')}`); });
  });
  document.getElementById('warn').textContent = dup.length ? 'Attenzione: ' + dup.join('; ') + '.' : '';
}
function setv(k, i, f, v){ edit[k][i][f] = v; const row = document.querySelectorAll(`.col.${k === 'autisti' ? 'aut' : 'inf'} .row`)[i]; check(); if(row){ const base = (saved ? saved[k] : []).some(x => x.nome === edit[k][i].nome.trim() && x.codice === edit[k][i].codice.trim()); row.classList.toggle('changed', !base); } }
function add(k){ edit[k].push({ nome:'', codice:'' }); render(); const rows = document.querySelectorAll(`.col.${k === 'autisti' ? 'aut' : 'inf'} .row`); const last = rows[rows.length - 1]; if(last) last.querySelector('input').focus(); }
function del(k, i){ edit[k].splice(i, 1); render(); }
function annulla(){ edit = JSON.parse(JSON.stringify(saved)); render(); }
async function salva(){
  if(!ref || saving) return;
  const data = norm(edit);
  saving = true; check();
  try {
    await ref.set(Object.assign({}, data, { updatedAt: new Date().toISOString() }));
    saved = data; edit = JSON.parse(JSON.stringify(data));
    saving = false; render();
    setStatus('Salvato alle ' + new Date().toLocaleTimeString('it-IT', { hour:'2-digit', minute:'2-digit' }) + ' — lo sfondo si aggiorna entro un minuto', 'ok');
  } catch(e){
    saving = false; check();
    setStatus('Salvataggio non riuscito: ' + (e.code || e.message), 'err');
  }
}
window.addEventListener('beforeunload', e => { if(saved && edit && !same(edit, saved)){ e.preventDefault(); e.returnValue = ''; } });

try {
  firebase.initializeApp(FB);
  db = firebase.firestore();
  ref = db.collection('admin_config').doc('monitor_rubrica');
  ref.onSnapshot(doc => {
    const remote = doc.exists ? norm(doc.data() || {}) : norm(RUBRICA_DEFAULT);
    const wasDirty = saved && edit && !same(edit, saved);
    saved = remote;
    if(!edit || !wasDirty) edit = JSON.parse(JSON.stringify(remote));
    render();
    const when = doc.exists && doc.data().updatedAt ? new Date(doc.data().updatedAt) : null;
    if(wasDirty) setStatus('Qualcuno ha appena salvato un’altra versione: le tue modifiche restano da salvare', 'err');
    else setStatus(when ? 'Ultimo salvataggio: ' + when.toLocaleString('it-IT', { day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' }) : 'Tabella originale (non ancora modificata)', 'ok');
  }, e => { saved = norm(RUBRICA_DEFAULT); edit = JSON.parse(JSON.stringify(saved)); render(); setStatus('Firebase non raggiungibile: ' + (e.code || e.message), 'err'); });
} catch(e){ setStatus('Firebase non disponibile', 'err'); }
</script>
</body>
</html>
